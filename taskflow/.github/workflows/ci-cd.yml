name: TaskFlow CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_USERNAME: devansh2121
  BACKEND_IMAGE:   devansh2121/taskflow-backend
  FRONTEND_IMAGE:  devansh2121/taskflow-frontend

jobs:

  # ── Job 1: Test Backend ──────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       taskflow_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run database migrations
        working-directory: backend
        env:
          NODE_ENV:      test
          DB_HOST:       localhost
          DB_PORT:       5432
          DB_NAME:       taskflow_test
          DB_USER:       postgres
          DB_PASSWORD:   postgres
          JWT_SECRET:    test_secret_key_for_ci
          JWT_EXPIRES_IN: 7d
          PORT:          4000
        run: npm run migrate

      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV:      test
          DB_HOST:       localhost
          DB_PORT:       5432
          DB_NAME:       taskflow_test
          DB_USER:       postgres
          DB_PASSWORD:   postgres
          JWT_SECRET:    test_secret_key_for_ci
          JWT_EXPIRES_IN: 7d
          PORT:          4000
        run: npm test

  # ── Job 2: Build & Push Docker Images ───────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      backend_tag:  ${{ steps.meta-backend.outputs.version }}
      frontend_tag: ${{ steps.meta-frontend.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context:    ./backend
          push:       true
          tags:       ${{ steps.meta-backend.outputs.tags }}
          labels:     ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context:    ./frontend
          push:       true
          tags:       ${{ steps.meta-frontend.outputs.tags }}
          labels:     ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Job 3: Deploy to EC2 ─────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull devansh2121/taskflow-backend:latest
            docker pull devansh2121/taskflow-frontend:latest
            cd ~/taskflow
            echo "DB_HOST=${{ secrets.DB_HOST }}"           >  .env.production
            echo "DB_PORT=5432"                             >> .env.production
            echo "DB_NAME=taskflow"                         >> .env.production
            echo "DB_USER=${{ secrets.DB_USER }}"           >> .env.production
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"   >> .env.production
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"     >> .env.production
            echo "JWT_EXPIRES_IN=7d"                        >> .env.production
            echo "CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}"   >> .env.production
            echo "NODE_ENV=production"                      >> .env.production
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            echo "Deployment complete!"
