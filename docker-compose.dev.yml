version: '3.9'

# ── Development overrides ───────────────────────────────────
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Differences from base:
#  - Backend runs with nodemon (hot reload on file save)
#  - Frontend runs Vite dev server (HMR) instead of Nginx
#  - Source folders mounted as volumes so changes reflect instantly

services:

  backend:
    # Override CMD to use nodemon
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app          # mount entire backend for nodemon
      - /app/node_modules       # keep container's node_modules isolated

  frontend:
    # Override to run Vite dev server instead of Nginx build
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev   # see below
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:4000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
